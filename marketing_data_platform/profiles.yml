
marketing_data_platform:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"

  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DEV_HTTP_PATH') }}"
      catalog: "{{ env_var('DEV_CATALOG') }}"
      schema: "{{ env_var('DEV_SCHEMA') }}"
      token: "{{ env_var('DATABRICKS_PAT_TOKEN') }}"
      threads: 4

    ci:
      type: databricks
      auth_type: oauth
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DEV_HTTP_PATH') }}"
      catalog: "{{ env_var('CI_CATALOG') }}"
      schema: "{{ env_var('CI_SCHEMA', 'ci') }}"
      client_id: "{{ env_var('DBX_ID_APPLICATION_ID') }}"
      client_secret: "{{ env_var('DBX_SECRET') }}"
      threads: 4
      connect_retries: 3
      retry_all: true

    staging:
      type: databricks
      auth_type: oauth
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DEV_HTTP_PATH') }}"
      catalog: "{{ env_var('STAGING_CATALOG') }}"
      schema: "{{ env_var('STAGING_SCHEMA', 'staging') }}"
      client_id: "{{ env_var('DBX_ID_APPLICATION_ID') }}"
      client_secret: "{{ env_var('DBX_SECRET') }}"
      threads: 4
      connect_retries: 3
      retry_all: true

    production:
      type: databricks
      auth_type: oauth
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DEV_HTTP_PATH') }}"
      catalog: "{{ env_var('PROD_CATALOG') }}"
      schema: "{{ env_var('PROD_SCHEMA', 'prod') }}"
      client_id: "{{ env_var('DBX_ID_APPLICATION_ID') }}"
      client_secret: "{{ env_var('DBX_SECRET') }}"
      threads: 4
      connect_retries: 3
      retry_all: true

