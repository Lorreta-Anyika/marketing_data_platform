
version: 2

models:
  - name: stg_facebook__ad_groups
    description: "Staging model for Facebook ad groups, including ad-group identifiers, names, and update timestamps."

    columns:
      - name: ad_group_id
        description: "Identifier for a Facebook advertising ad group."
        data_tests:
          - not_null
          - unique

      - name: ad_group_name
        description: "Name of the Facebook ad group."

      - name: ad_group_updated_at
        description: "Timestamp when the ad-group details were last updated."
