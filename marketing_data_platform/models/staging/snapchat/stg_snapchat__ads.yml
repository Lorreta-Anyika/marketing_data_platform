
version: 2

models:
  - name: stg_snapchat__ads
    description: "Staging model for Snapchat ads, including ad identifiers, ad-group associations, names, and update timestamps."

    columns:
      - name: ad_id
        description: "Identifier for the Snapchat ad."
        data_tests:
          - not_null
          - unique

      - name: ad_group_id
        description: "Identifier of the ad group associated with the ad."
        data_tests:
          - not_null

      - name: ad_name
        description: "Name of the Snapchat ad."

      - name: ad_detail_updated_at
        description: "Timestamp when the ad details were last updated."
